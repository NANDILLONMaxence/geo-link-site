# Développement : rechargement automatique et débogueur Flask.
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Le débogueur Werkzeug permet d'exécuter du code : port publié sur 127.0.0.1 seulement.
services:
  geo-link-site:
    ports: !override
      - "127.0.0.1:5000:5000"
    volumes:
      - ./app:/app/app
    environment:
      - FLASK_APP=app.app
      - FLASK_DEBUG=1
    command: python -m flask run --host=0.0.0.0 --port=5000
