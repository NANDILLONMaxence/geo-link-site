name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.15'
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app tests --max-line-length=120 --extend-ignore=E501,W503

      - name: Check JavaScript syntax
        run: for f in app/static/js/*.js; do node --check "$f"; done

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --strict

      - name: Static security analysis (bandit)
        run: bandit -r app -ll

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t geo-link-site:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 5000:5000 geo-link-site:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5000/status && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  # Job unique à exiger dans la protection de branche : il ne change pas de nom
  # quand la matrice Python évolue.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
